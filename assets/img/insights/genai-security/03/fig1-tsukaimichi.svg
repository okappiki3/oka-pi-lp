<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" fill="#ffffff"/>

  <text x="48" y="56" font-size="27" font-weight="bold" fill="#0a5884">使い道が変われば、確認の重さも変わる</text>
  <line x1="48" y1="74" x2="912" y2="74" stroke="#0a5884" stroke-width="2"/>

  <text x="160" y="112" font-size="17" font-weight="bold" fill="#5b6b76">その答えを、何に使うか</text>
  <text x="530" y="112" font-size="17" font-weight="bold" fill="#5b6b76">どこまで確かめるか</text>

  <!-- 影響の軸 -->
  <line x1="72" y1="130" x2="72" y2="540" stroke="#b9c4cc" stroke-width="2"/>
  <polygon points="72,548 66,534 78,534" fill="#b9c4cc"/>
  <text x="58" y="360" font-size="16" fill="#7a878f" transform="rotate(-90 58 360)" text-anchor="middle">間違えたときの影響が大きくなる</text>

  <!-- 1 -->
  <rect x="100" y="130" width="812" height="92" rx="8" fill="#eef4f8"/>
  <rect x="100" y="130" width="6" height="92" rx="3" fill="#c3d6e2"/>
  <text x="128" y="167" font-size="20" font-weight="bold" fill="#153c52">自分用のメモ、アイデア出し</text>
  <text x="128" y="197" font-size="16" fill="#5b6b76">自分が気づけば直せる</text>
  <text x="530" y="182" font-size="19" fill="#153c52">全体を読んで、違和感がないか</text>

  <!-- 2 -->
  <rect x="100" y="234" width="812" height="92" rx="8" fill="#dfebf3"/>
  <rect x="100" y="234" width="6" height="92" rx="3" fill="#9dbdd2"/>
  <text x="128" y="271" font-size="20" font-weight="bold" fill="#153c52">社内の下書き</text>
  <text x="128" y="301" font-size="16" fill="#5b6b76">人が手を入れてから使う</text>
  <text x="530" y="278" font-size="19" fill="#153c52">数字・日付・固有名詞など、</text>
  <text x="530" y="304" font-size="19" fill="#153c52">間違えると困るところ</text>

  <!-- 3 -->
  <rect x="100" y="338" width="812" height="92" rx="8" fill="#c3d8e6"/>
  <rect x="100" y="338" width="6" height="92" rx="3" fill="#4d87a8"/>
  <text x="128" y="375" font-size="20" font-weight="bold" fill="#0a5884">支援先に渡す資料</text>
  <text x="128" y="405" font-size="16" fill="#48606f">誤った前提のまま経営判断が進む</text>
  <text x="530" y="390" font-size="19" fill="#153c52">元の資料と突き合わせる</text>

  <!-- 4 -->
  <rect x="100" y="442" width="812" height="98" rx="8" fill="#0a5884"/>
  <rect x="100" y="442" width="6" height="98" rx="3" fill="#08405f"/>
  <text x="128" y="480" font-size="20" font-weight="bold" fill="#ffffff">交渉・申請・外部への提出</text>
  <text x="128" y="510" font-size="16" fill="#c9dde9">相手に伝わったあとでは修正しにくい</text>
  <text x="530" y="486" font-size="19" fill="#ffffff">原典まで確認。</text>
  <text x="530" y="512" font-size="19" fill="#ffffff">AIの文章は下書きとして使う</text>

  <text x="912" y="578" font-size="14" fill="#9aa6ae" text-anchor="end">オカピー・パートナーズ</text>
</svg>
