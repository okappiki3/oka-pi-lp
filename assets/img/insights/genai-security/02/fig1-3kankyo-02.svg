<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="740" height="470" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0a5884">無料・個人有料・法人向けで、何が変わるか</text>

  <!-- header -->
  <rect x="155" y="52" width="185" height="42" fill="#eef3f7"/>
  <rect x="345" y="52" width="185" height="42" fill="#eef3f7"/>
  <rect x="535" y="52" width="185" height="42" fill="#0a5884"/>
  <text x="247" y="79" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">無料</text>
  <text x="437" y="79" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">個人有料</text>
  <text x="627" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">法人向け</text>

  <!-- rows -->
  <g font-size="13" fill="#1f2937">
    <!-- row 1 -->
    <rect x="20" y="98" width="700" height="60" fill="#fafbfc"/>
    <text x="30" y="134" font-size="13" font-weight="bold" fill="#0a5884">誰が管理するか</text>
    <text x="247" y="134" text-anchor="middle">個人</text>
    <text x="437" y="134" text-anchor="middle">個人</text>
    <text x="627" y="134" text-anchor="middle" font-weight="bold" fill="#0a5884">会社</text>

    <!-- row 2 -->
    <rect x="20" y="162" width="700" height="60" fill="#ffffff"/>
    <text x="30" y="198" font-size="13" font-weight="bold" fill="#0a5884">使われ方の把握</text>
    <text x="247" y="198" text-anchor="middle">会社からは分からない</text>
    <text x="437" y="198" text-anchor="middle">会社からは分からない</text>
    <text x="627" y="198" text-anchor="middle" font-weight="bold" fill="#0a5884">会社で確認できる</text>

    <!-- row 3 -->
    <rect x="20" y="226" width="700" height="60" fill="#fafbfc"/>
    <text x="30" y="262" font-size="13" font-weight="bold" fill="#0a5884">データの扱い</text>
    <text x="247" y="262" text-anchor="middle">設定で変える</text>
    <text x="437" y="262" text-anchor="middle">設定で変える</text>
    <text x="627" y="262" text-anchor="middle" font-weight="bold" fill="#0a5884">契約でも定められる</text>

    <!-- row 4 -->
    <rect x="20" y="290" width="700" height="60" fill="#ffffff"/>
    <text x="30" y="326" font-size="13" font-weight="bold" fill="#0a5884">退職・異動のとき</text>
    <text x="247" y="326" text-anchor="middle">会社からは止めにくい</text>
    <text x="437" y="326" text-anchor="middle">会社からは止めにくい</text>
    <text x="627" y="326" text-anchor="middle" font-weight="bold" fill="#0a5884">会社で止められる</text>
  </g>

  <line x1="20" y1="98" x2="720" y2="98" stroke="#d5dee5" stroke-width="1"/>
  <line x1="20" y1="162" x2="720" y2="162" stroke="#d5dee5" stroke-width="1"/>
  <line x1="20" y1="226" x2="720" y2="226" stroke="#d5dee5" stroke-width="1"/>
  <line x1="20" y1="290" x2="720" y2="290" stroke="#d5dee5" stroke-width="1"/>
  <line x1="20" y1="350" x2="720" y2="350" stroke="#d5dee5" stroke-width="1"/>
  <line x1="530" y1="52" x2="530" y2="350" stroke="#0a5884" stroke-width="1.5"/>

  <!-- brackets -->
  <g stroke="#0a5884" stroke-width="1.5" fill="none">
    <path d="M 165 372 L 165 384 L 520 384 L 520 372"/>
    <path d="M 355 410 L 355 422 L 710 422 L 710 410"/>
  </g>
  <text x="342" y="404" font-size="14" font-weight="bold" fill="#0a5884" text-anchor="middle">ここで変わるのは、機能</text>
  <text x="532" y="442" font-size="14" font-weight="bold" fill="#0a5884" text-anchor="middle">ここで変わるのは、統制</text>

  <text x="20" y="462" font-size="11" fill="#6b7280">典型的な違い。中身はサービス・プランによって異なります（2026年9月時点）</text>
</svg>
