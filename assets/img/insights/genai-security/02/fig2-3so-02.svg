<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="740" height="430" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="740" height="430" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0a5884">できることには、3つの層がある</text>

  <!-- arrow -->
  <g stroke="#0a5884" stroke-width="2" fill="none">
    <path d="M 42 372 L 42 78"/>
    <path d="M 34 90 L 42 76 L 50 90"/>
  </g>
  <text x="26" y="240" font-size="12" fill="#0a5884" transform="rotate(-90 26 240)" text-anchor="middle">個人の設定では届かない</text>

  <!-- layer 3 -->
  <rect x="70" y="62" width="650" height="94" fill="#0a5884"/>
  <text x="92" y="92" font-size="15" font-weight="bold" fill="#ffffff">契約・環境が要ること</text>
  <g font-size="13" fill="#ffffff">
    <text x="92" y="118">実際の業務データを扱う　／　アカウントと権限を会社で管理する</text>
    <text x="92" y="140">ログを残す　／　データの扱いを契約で定める（DPA）</text>
  </g>

  <!-- layer 2 -->
  <rect x="70" y="168" width="650" height="94" fill="#cfe0eb"/>
  <text x="92" y="198" font-size="15" font-weight="bold" fill="#0a5884">会社で決めること</text>
  <g font-size="13" fill="#1f2937">
    <text x="92" y="224">何を入力してよいか　／　どのAIを業務で使うか</text>
    <text x="92" y="246">顧客情報の扱い　／　困ったときに誰に聞くか</text>
  </g>

  <!-- layer 1 -->
  <rect x="70" y="274" width="650" height="94" fill="#eef3f7"/>
  <text x="92" y="304" font-size="15" font-weight="bold" fill="#0a5884">個人でできること</text>
  <g font-size="13" fill="#1f2937">
    <text x="92" y="330">業務用と個人用のアカウントを分ける　／　学習利用と履歴の設定を確認する</text>
    <text x="92" y="352">案件ごとにスレッドを分ける　／　渡す情報を、必要な範囲に絞る</text>
  </g>

  <text x="70" y="398" font-size="13" fill="#1f2937">「顧客情報をAIに入れてよいか」は、<tspan font-weight="bold" fill="#0a5884">真ん中の層</tspan>。使う人が案件ごとに決めることではありません。</text>
</svg>
